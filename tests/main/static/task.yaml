summary: Check that snap can be built without cgo

details: |
    This test builds snap with CGO_ENABLED=0 and checks that the resulting
    binary is not a dynamic executable.

# debian-sid uses a different packaging with quilt patches applied on top
# of the verbatim tree
systems: [-ubuntu-core-*, -debian-sid-*]

execute: |
    CGO_ENABLED=0 go build -o snap.static github.com/snapcore/snapd/cmd/snap
    ldd snap.static 2>&1 | MATCH 'not a dynamic executable'
